name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - ktjs-iconify-types
          - ktjs-iconify-utils
          - ktjs-iconify-tools
          - ktjs-iconify-icon

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Central Portal user token, not the account password. The GPG key is passed in memory;
      # the key id is optional and embedded in the key itself.
      - name: Publish and release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.module }}" = "all" ]; then
            ./gradlew publishToMavenCentral --stacktrace
          else
            ./gradlew ":${{ inputs.module }}:publishToMavenCentral" --stacktrace
          fi
