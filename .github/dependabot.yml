version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      kotlin-wrappers:
        patterns:
          - "org.jetbrains.kotlin-wrappers*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      iconify:
        patterns:
          - "@iconify/*"
          - "iconify-icon"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
