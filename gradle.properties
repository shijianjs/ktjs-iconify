kotlin.js.yarn=false

# The tools test suite is large enough to exhaust the Kotlin daemon's default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# The ktjs-docusaurus versions the docs site is built with: the Gradle plugin (settings.gradle.kts),
# the wrapper klib (docs/build.gradle.kts) and the kit whose home sections this site's landing page
# uses. All three come from that project, but every module there carries its own revision, so the
# numbers are independent and all of them are needed.
#
# `mavenLocal` in settings.gradle.kts resolves a SNAPSHOT here: a working tree of ktjs-docusaurus
# publishes one with `./gradlew publishToMavenLocal` (root build for the klibs) and the same task in
# `ktjs-docusaurus-gradle-plugin/` (for the plugin). Released versions come from Maven Central and
# need neither.
ktjs-docusaurus.version=3.10.2-kt.2-SNAPSHOT
ktjs-docusaurus-gradle-plugin.version=3.10.2-kt.1-SNAPSHOT
ktjs-docusaurus-kit.version=0.1.0-SNAPSHOT
